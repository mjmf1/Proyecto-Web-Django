<!DOCTYPE html>
<html>
<head>
    <title>Servicios</title>
    <style>
        .servicio {
            border: 1px solid #ddd;
            margin: 15px 0;
            padding: 15px;
            border-radius: 5px;
        }
        .servicio img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
        }
    </style>
</head>
<body>
    <h1>Nuestros Servicios</h1>
    {% if servicios %}
        {% for servicio in servicios %}
            <div class="servicio">
                <h2>{{ servicio.titulo }}</h2>
                {% if servicio.imagen %}
                    <img src="{{ servicio.imagen.url }}" alt="{{ servicio.titulo }}">
                {% endif %}
                <p>{{ servicio.contenido }}</p>
                <small>Creado: {{ servicio.created_at|date:"d/m/Y H:i" }}</small>
            </div>
        {% endfor %}
    {% else %}
        <p>No hay servicios disponibles.</p>
    {% endif %}
</body>
</html>
