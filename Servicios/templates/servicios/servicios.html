{% extends "ProyectoWebApp/base.html" %}

{% block title %}Servicios{% endblock %}

{% block content %}

    {% for servicio in servicios %}
        <section class="page-section clearfix">
            <div class="container"> 
                <div class="intro">
                    {% if servicio.imagen %}
                        <img class="intro-img img-fluid mb-3 mb-lg-0 rounded" src="{{ servicio.imagen.url }}" alt="{{ servicio.titulo }}" style = "width: 50%;">
                    {% endif %}
                    <div class="intro-text left-0 text-center bg-faded p-5 rounded">
                        <h2 class="section-heading mb-4">
                            <span class="section-heading-lower">{{ servicio.titulo }}</span>
                            <span class="section-heading-upper">{{ servicio.contenido }}</span>
                        </h2>
                    </div>
                </div>
            </div>
        </section>
    {% empty %}
        <section class="page-section clearfix">
            <div class="container">
                <div class="intro">
                    <div class="intro-text text-center bg-faded p-5 rounded">
                        <h2 class="section-heading mb-4">
                            <span class="section-heading-lower">No hay servicios disponibles</span>
                        </h2>
                    </div>
                </div>
            </div>
        </section>
    {% endfor %}

{% endblock %}
